name: Build Plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        plugin:
          - cowork-work
          - cowork-utils
          - cowork-life
          - cowork-skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r .version "plugins/${{ matrix.plugin }}/.claude-plugin/plugin.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .plugin file
        run: |
          mkdir -p dist
          cd "plugins/${{ matrix.plugin }}"
          zip -ry "../../dist/${{ matrix.plugin }}-${{ steps.version.outputs.version }}.plugin" . \
            -x "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-plugin
          path: dist/${{ matrix.plugin }}-*.plugin
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-plugin'
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.plugin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
